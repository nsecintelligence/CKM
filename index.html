
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />

    <!-- Primary SEO -->
    <title>Charles Kulwa Memorial Hospital | Quality Healthcare</title>
    <meta
      name="description"
      content="Charles Kulwa Memorial Hospital provides compassionate, reliable and high-quality healthcare through experienced medical professionals and modern healthcare facilities."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#15803d" />
    <meta name="author" content="Charles Kulwa Memorial Hospital" />
    <link rel="canonical" href="https://www.ckmhospital.org/" />

    <!-- Favicon & Branding -->
    <link rel="icon" type="image/x-icon" href="/ckmlogo.ico" />
    <link rel="apple-touch-icon" href="/ckmlogo.png" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_TZ" />
    <meta
      property="og:site_name"
      content="Charles Kulwa Memorial Hospital"
    />
    <meta
      property="og:title"
      content="Charles Kulwa Memorial Hospital | Quality Healthcare"
    />
    <meta
      property="og:description"
      content="Mahitaji ya mgonjwa kwanza. Patient needs come first. Compassionate healthcare and professional medical services."
    />
    <meta property="og:url" content="https://www.ckmhospital.org/" />
    <meta
      property="og:image"
      content="https://www.ckmhospital.org/ckm-social-share.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Charles Kulwa Memorial Hospital - Quality Healthcare"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Charles Kulwa Memorial Hospital | Quality Healthcare"
    />
    <meta
      name="twitter:description"
      content="Mahitaji ya mgonjwa kwanza. Compassionate, professional and quality healthcare."
    />
    <meta
      name="twitter:image"
      content="https://www.ckmhospital.org/ckm-social-share.jpg"
    />

    <!-- Hospital Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Hospital",
        "@id": "https://ckmhospital.org/#hospital",
        "name": "Charles Kulwa Memorial Hospital",
        "url": "https://www.ckmhospital.org/",
        "logo": "https://ckmhospital.org/ckmlogo.png",
        "description": "Charles Kulwa Memorial Hospital provides compassionate, reliable and high-quality healthcare through experienced medical professionals and modern healthcare facilities.",
        "slogan": "Mahitaji ya mgonjwa kwanza, Patient needs come first"
      }
    </script>

    <!-- Performance Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Browser Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
